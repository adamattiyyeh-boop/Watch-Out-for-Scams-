<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine for Dema</title>

<style>
:root{
  --yes:#ff4d6d;
  --no:#6c757d;
  --card:#ffffffdd;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  background:#000;
  overflow:hidden;
}

/* MAIN CARD */
.card{
  width:min(620px,92vw);
  padding:28px;
  border-radius:26px;
  background:
    linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.35)),
    url("bg.jpg") center / cover no-repeat;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  color:white;
  position:relative;
  text-align:center;
}

/* TEXT */
h1{
  margin:0 0 8px;
  font-size:clamp(26px,4vw,40px);
}
p{
  margin:0 0 18px;
  opacity:.95;
}

/* BUTTON AREA */
.playground{
  position:relative;
  height:260px;
  border-radius:18px;
}

/* BUTTONS */
.btn{
  border:none;
  padding:14px 22px;
  border-radius:999px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:transform .1s ease;
}
.btn:active{transform:scale(.96)}

#yes{
  background:var(--yes);
  color:white;
  box-shadow:0 10px 25px rgba(255,77,109,.45);
}

#no{
  position:absolute;
  background:var(--no);
  color:white;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
}

/* HEARTS */
.hearts{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}
.heart{
  position:absolute;
  bottom:-40px;
  font-size:22px;
  animation:floatUp linear forwards;
}
@keyframes floatUp{
  to{
    transform:translateY(-700px) rotate(18deg);
    opacity:0;
  }
}

/* FINAL SCREEN */
.final{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(10px);
  display:none;
  place-items:center;
}
.final.show{display:grid}

.finalCard{
  background:var(--card);
  color:#111;
  padding:26px;
  border-radius:22px;
  width:min(520px,92vw);
  text-align:center;
}

.final h2{
  margin:0 0 10px;
}
.final p{
  margin:0 0 16px;
  line-height:1.35;
}

.pill{
  padding:10px 18px;
  border-radius:999px;
  border:none;
  font-weight:800;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="card">
  <div class="hearts" id="hearts"></div>

  <h1>Will you be my Valentine, Dema? 💘</h1>
  <p>Try clicking “No”…</p>

  <div class="playground" id="playground">
    <button class="btn" id="yes">Yes 💞</button>
    <button class="btn" id="no">No 🙅‍♀️</button>
  </div>
</div>

<!-- FINAL SCREEN -->
<div class="final" id="final">
  <div class="finalCard">
    <h2>YAYYY DEMAAAA 🥰💖</h2>
    <p>
      I love you, dummy. Of course, I was gonna ask you to be my Valentine.
      I predicted you would say something about me not asking thats why I added that part!
    </p>
    <button class="pill" id="again">🔁 Do it again</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("no");
const playground = document.getElementById("playground");
const yesBtn = document.getElementById("yes");
const finalScreen = document.getElementById("final");
const hearts = document.getElementById("hearts");
const againBtn = document.getElementById("again");

function moveNo(){
  const area = playground.getBoundingClientRect();
  const btn = noBtn.getBoundingClientRect();

  const x = Math.random() * (area.width - btn.width);
  const y = Math.random() * (area.height - btn.height);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

// Initial placement
moveNo();

// Avoid mouse
playground.addEventListener("mousemove", e=>{
  const b = noBtn.getBoundingClientRect();
  const d = Math.hypot(e.clientX - (b.left+b.width/2), e.clientY - (b.top+b.height/2));
  if(d < 120) moveNo();
});

// Hearts
function spawnHearts(n=12){
  for(let i=0;i<n;i++){
    const h = document.createElement("div");
    h.className="heart";
    h.textContent=Math.random()<.5?"💖":"💘";
    h.style.left=Math.random()*window.innerWidth+"px";
    h.style.animationDuration=(2+Math.random()*2)+"s";
    hearts.appendChild(h);
    setTimeout(()=>h.remove(),4000);
  }
}

yesBtn.onclick = ()=>{
  finalScreen.classList.add("show");
  setInterval(()=>spawnHearts(10),300);
};

againBtn.onclick = ()=>{
  location.reload();
};
</script>

</body>
</html>
