<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Valentine for Dema</title>

<style>
  :root{
    --yes:#ff4d6d;
    --no:#6c757d;
    --shadow: 0 22px 70px rgba(0,0,0,.45);
    --cardText: #fff;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background:#0b0b0b;
    overflow:hidden;
  }

  /* MAIN CARD */
  .card{
    width:min(680px, 94vw);
    height: 500px; /* Added height for better structure */
    border-radius:28px;
    overflow:hidden;
    position:relative;
    box-shadow: var(--shadow);
    color: var(--cardText);
  }

  /* Background photo */
  .bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    transform: scale(1.03);
    filter: saturate(1.1) contrast(1.05) brightness(.70);
    z-index: 0;
  }

  .overlay{
    position:absolute;
    inset:0;
    background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%);
    z-index: 1;
  }

  .content{
    position:relative;
    z-index: 2;
    padding:40px 26px;
    text-align:center;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  h1{
    margin:0 0 8px;
    font-size: clamp(26px, 4vw, 44px);
    text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
  }

  .playground{
    position:relative;
    height:200px;
    margin-top: 20px;
  }

  /* Buttons */
  .btn{
    border:none;
    padding:14px 28px;
    border-radius:999px;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
    position: relative;
    transition: transform .1s ease;
  }

  #yes{
    background: var(--yes);
    color:white;
    box-shadow: 0 10px 20px rgba(255,77,109,0.4);
    z-index: 10;
  }

  #no{
    position:absolute;
    background: var(--no);
    color:white;
    z-index: 5;
  }

  /* FINAL SCREEN */
  .final{
    position:fixed;
    inset:0;
    display:none;
    place-items:center;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    z-index: 100; /* Below the hearts */
  }
  .final.show{ display:grid; }

  .finalCard{
    width:min(500px, 90vw);
    background: white;
    color:#111;
    border-radius:22px;
    padding:40px;
    text-align:center;
  }

  /* FULLSCREEN HEART RAIN */
  .heartsFull{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index: 9999; /* HIGHEST LAYER */
  }

  .heart{
    position:absolute;
    top:-80px;
    will-change: transform;
    animation: fallDown linear forwards;
  }

  @keyframes fallDown{
    to { transform: translateY(110vh) rotate(360deg); }
  }
</style>
</head>
<body>

<div class="card">
  <img id="bgImg" class="bg" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1000" alt="Background">
  <div class="overlay"></div>

  <div class="content">
    <h1>Will you be my Valentine, Dema? 💘</h1>
    <p>I know you're gonna try to say no...</p>

    <div class="playground" id="playground">
      <button class="btn" id="yes">Yes 💞</button>
      <button class="btn" id="no">No 🙅‍♀️</button>
    </div>
  </div>
</div>

<div class="final" id="final">
  <div class="finalCard">
    <h2>YAYYY DEMAAAA 🥰💖</h2>
    <p>I love you, dummy. I knew you'd try to click no, so I made it impossible!</p>
    <button class="btn" id="again" style="background:#111; color:white;">🔁 Do it again</button>
  </div>
</div>

<div class="heartsFull" id="heartsFull"></div>

<script>
  const noBtn = document.getElementById("no");
  const playground = document.getElementById("playground");
  const yesBtn = document.getElementById("yes");
  const finalScreen = document.getElementById("final");
  const heartsFull = document.getElementById("heartsFull");
  const againBtn = document.getElementById("again");

  function moveNo() {
    const pRect = playground.getBoundingClientRect();
    const bRect = noBtn.getBoundingClientRect();

    // Calculate max positions so button stays inside the card
    const maxX = pRect.width - bRect.width;
    const maxY = pRect.height - bRect.height;

    const randomX = Math.floor(Math.random() * maxX);
    const randomY = Math.floor(Math.random() * maxY);

    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
  }

  // Move on hover and click
  noBtn.addEventListener("mouseenter", moveNo);
  noBtn.addEventListener("click", (e) => {
    e.preventDefault();
    moveNo();
  });

  function spawnHearts() {
    const heartEmojis = ["💖", "💘", "💕", "❤️", "🌸"];
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 30 + 20) + "px";
    heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
    
    heartsFull.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
  }

  let heartInterval;

  yesBtn.addEventListener("click", () => {
    finalScreen.classList.add("show");
    heartInterval = setInterval(spawnHearts, 150);
    // Initial burst
    for(let i=0; i<20; i++) spawnHearts();
  });

  againBtn.addEventListener("click", () => {
    finalScreen.classList.remove("show");
    clearInterval(heartInterval);
    heartsFull.innerHTML = "";
  });
</script>

</body>
</html>
