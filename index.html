<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine for Dema</title>
  <style>
    :root{
      --bg1:#ffdee9;
      --bg2:#b5fffc;
      --card:#ffffffcc;
      --shadow: 0 20px 60px rgba(0,0,0,.15);
      --yes:#ff4d6d;
      --no:#6c757d;
      --ink:#151515;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, var(--bg1), var(--bg2));
      overflow:hidden;
      color:var(--ink);
    }
    .card{
      width:min(600px, 92vw);
      padding:28px 24px;
      border-radius:24px;
      background:var(--card);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    h1{
      margin:0 0 8px;
      font-size: clamp(24px, 4vw, 38px);
      letter-spacing:-.02em;
    }
    p{
      margin:0 0 18px;
      opacity:.85;
      font-size: 16px;
    }

    .playground{
      position:relative;
      height:285px;
      border-radius:18px;
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(0,0,0,.06);
      overflow:hidden;
      margin-top:14px;
    }

    .btn{
      border:none;
      padding:14px 18px;
      border-radius:999px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      transition: transform .08s ease, filter .15s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      letter-spacing:.2px;
      white-space:nowrap;
    }
    .btn:active{ transform: scale(.98); }

    #yes{
      background: var(--yes);
      color:white;
      box-shadow: 0 12px 25px rgba(255, 77, 109, .35);
    }
    #yes:hover{ filter: brightness(1.03); }

    /* Rope SVG */
    #rope{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
    }

    /* Horse */
    #horse{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%, -50%);
      user-select:none;
      pointer-events:none;
      will-change: left, top, transform, opacity;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.15));
    }
    .horseWrap{
      position:relative;
      display:block;
      animation: gallopBob 220ms infinite alternate ease-in-out;
    }
    #horse img{
      width: 130px; /* bigger horse */
      height:auto;
      display:block;
    }

    /* Fake running legs overlay */
    .legs{
      position:absolute;
      left: 18%;
      right: 10%;
      bottom: -8px;
      height: 30px;
      pointer-events:none;
      opacity: 0.75;
      filter: blur(0.2px);
    }
    .leg{
      position:absolute;
      width: 11px;
      height: 26px;
      background: rgba(0,0,0,.35);
      border-radius: 999px;
      transform-origin: top center;
    }
    .leg.l1{ left: 8%;  animation: legKick 140ms infinite alternate; }
    .leg.l2{ left: 28%; animation: legKick 140ms infinite alternate-reverse; }
    .leg.l3{ left: 58%; animation: legKick 140ms infinite alternate; }
    .leg.l4{ left: 78%; animation: legKick 140ms infinite alternate-reverse; }

    @keyframes gallopBob{
      from { transform: translateY(0px) rotate(-1deg); }
      to   { transform: translateY(4px) rotate(1deg); }
    }
    @keyframes legKick{
      from { transform: rotate(18deg) translateY(0px); }
      to   { transform: rotate(-22deg) translateY(2px); }
    }

    /* The "No" button */
    #no{
      position:absolute;
      left: 65%;
      top: 55%;
      transform: translate(-50%, -50%);
      background: var(--no);
      color:white;
      box-shadow: 0 12px 25px rgba(108, 117, 125, .25);
      touch-action: manipulation;
      will-change: left, top;
      display:flex;
      align-items:center;
      gap:8px;
    }
    #no .tag{ font-size:18px; line-height:1; }

    /* Dust particles */
    .dustLayer{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
    }
    .dust{
      position:absolute;
      width:10px;
      height:10px;
      border-radius:999px;
      background: rgba(0,0,0,.12);
      filter: blur(.4px);
      transform: translate(-50%, -50%) scale(1);
      animation: dustPuff 650ms ease-out forwards;
    }
    @keyframes dustPuff{
      0%   { opacity: .35; transform: translate(-50%, -50%) scale(.7); }
      60%  { opacity: .18; transform: translate(calc(-50% + 18px), calc(-50% - 10px)) scale(1.5); }
      100% { opacity: 0;   transform: translate(calc(-50% + 28px), calc(-50% - 14px)) scale(1.9); }
    }

    .row{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .result{
      margin-top:14px;
      font-weight:800;
      font-size:18px;
      min-height: 26px;
    }

    /* Hearts */
    .hearts{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      border-radius:24px;
    }
    .heart{
      position:absolute;
      bottom:-30px;
      font-size:18px;
      animation: floatUp linear forwards;
      opacity:.95;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.12));
    }
    @keyframes floatUp{
      to{
        transform: translateY(-500px) rotate(18deg);
        opacity:0;
      }
    }

    /* Final screen */
    .final{
      position:absolute;
      inset:0;
      display:none;
      place-items:center;
      padding:26px;
      background: radial-gradient(circle at top, rgba(255,255,255,.80), rgba(255,255,255,.58));
      backdrop-filter: blur(10px);
    }
    .final.show{ display:grid; }

    .finalCard{
      width:min(560px, 92vw);
      border-radius:22px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: var(--shadow);
      padding:22px 18px;
    }
    .finalTitle{
      font-size: clamp(22px, 4vw, 34px);
      margin:0 0 10px;
      letter-spacing:-.02em;
    }
    .finalMsg{
      margin:0 0 14px;
      opacity:.92;
      line-height:1.35;
      font-size:16px;
    }
    .catWrap{
      display:grid;
      place-items:center;
      margin: 12px 0 8px;
    }
    .catGif{
      width:min(320px, 85%);
      border-radius:18px;
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 14px 30px rgba(0,0,0,.12);
    }
    .pillRow{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:14px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 14px;
      border-radius:999px;
      font-weight:800;
      border: 1px solid rgba(0,0,0,.08);
      background: rgba(255,255,255,.75);
      cursor:pointer;
    }
    .pill:active{ transform: scale(.98); }
    .tiny{
      font-size:12px;
      opacity:.7;
      margin-top:10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="hearts" id="hearts"></div>

    <h1>Will you be my Valentine, Dema? 💘</h1>
    <p>Try clicking “No”… if the horse lets you 😭🐎</p>

    <div class="playground" id="playground" aria-label="button area">
      <div class="dustLayer" id="dustLayer"></div>

      <svg id="rope" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path id="ropePath" d="" fill="none" stroke="rgba(0,0,0,.20)" stroke-width="1.8" stroke-linecap="round" />
      </svg>

      <div class="row" style="position:absolute; inset:auto 0 18px 0;">
        <button class="btn" id="yes" type="button">Yes 💞</button>
      </div>

      <!-- Put horse.gif in the same folder as this HTML -->
      <div id="horse" aria-hidden="true">
        <div class="horseWrap">
          <img src="horse.gif" alt="Running horse"/>
          <div class="legs" aria-hidden="true">
            <span class="leg l1"></span>
            <span class="leg l2"></span>
            <span class="leg l3"></span>
            <span class="leg l4"></span>
          </div>
        </div>
      </div>

      <button class="btn" id="no" type="button">
        <span class="tag">🎀</span>
        No
      </button>
    </div>

    <div class="result" id="result"></div>

    <div class="final" id="final">
      <div class="finalCard">
        <h2 class="finalTitle">YAYYY DEMAAAAA 🥰💖</h2>

        <p class="finalMsg">
          I love you, dummy. Of course, I was gonna ask you to be my Valentine.
          I predicted you would say something about me not asking thats why I added that part!
        </p>

        <div class="catWrap">
          <img class="catGif" alt="Dancing cat gif"
               src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" />
        </div>

        <div class="pillRow">
          <button class="pill" id="moreHearts" type="button">💘 More hearts</button>
          <button class="pill" id="reset" type="button">🔁 Do it again</button>
        </div>

        <div class="tiny">P.S. The horse said “nope” 🐎</div>
      </div>
    </div>
  </div>

  <script>
    const playground = document.getElementById('playground');
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const result = document.getElementById('result');
    const heartsLayer = document.getElementById('hearts');
    const finalScreen = document.getElementById('final');
    const moreHeartsBtn = document.getElementById('moreHearts');
    const resetBtn = document.getElementById('reset');

    const horse = document.getElementById('horse');
    const ropePath = document.getElementById('ropePath');
    const dustLayer = document.getElementById('dustLayer');

    let accepted = false;

    // Horse motion state (normalized 0..1 within playground)
    let horseX = 0.5, horseY = 0.5;
    let horseVX = (Math.random() < 0.5 ? -1 : 1) * 0.0028;
    let horseVY = (Math.random() < 0.5 ? -1 : 1) * 0.0023;

    // Drag physics for No button
    let noX = 0.60, noY = 0.55;
    let noVX = 0, noVY = 0;

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }
    function lerp(a,b,t){ return a + (b-a)*t; }
    function areaRect(){ return playground.getBoundingClientRect(); }

    function setElNormPosition(el, xN, yN){
      const r = areaRect();
      const box = el.getBoundingClientRect();
      const pad = 12;

      const cx = xN * r.width;
      const cy = yN * r.height;

      const minX = pad + box.width/2;
      const maxX = r.width - pad - box.width/2;
      const minY = pad + box.height/2;
      const maxY = r.height - pad - box.height/2;

      el.style.left = clamp(cx, minX, maxX) + "px";
      el.style.top  = clamp(cy, minY, maxY) + "px";
    }

    function getCenterPct(el){
      const r = areaRect();
      const b = el.getBoundingClientRect();
      return {
        x: ((b.left + b.width/2) - r.left) / r.width * 100,
        y: ((b.top  + b.height/2) - r.top ) / r.height * 100
      };
    }

    function spawnHearts(count=18){
      const area = heartsLayer.getBoundingClientRect();
      for(let i=0;i<count;i++){
        const s = document.createElement('div');
        s.className = 'heart';
        s.textContent = Math.random() < .33 ? '💖' : (Math.random() < .5 ? '💘' : '💕');
        s.style.left = (Math.random() * area.width) + 'px';
        s.style.animationDuration = (1.6 + Math.random()*1.4) + 's';
        s.style.fontSize = (16 + Math.random()*22) + 'px';
        heartsLayer.appendChild(s);
        setTimeout(()=>s.remove(), 3200);
      }
    }

    function spawnDust(intensity = 1){
      const r = areaRect();
      const hb = horse.getBoundingClientRect();
      const x = (hb.left + hb.width*0.25) - r.left;
      const y = (hb.top + hb.height*0.80) - r.top;
      const count = Math.round(1 + intensity);

      for (let i = 0; i < count; i++){
        const d = document.createElement('div');
        d.className = 'dust';
        d.style.left = (x + (Math.random()*16 - 8)) + 'px';
        d.style.top  = (y + (Math.random()*10 - 5)) + 'px';
        d.style.width = (8 + Math.random()*10) + 'px';
        d.style.height = d.style.width;
        dustLayer.appendChild(d);
        setTimeout(()=>d.remove(), 800);
      }
    }

    // Neigh sound (no audio file)
    let audioCtx = null;
    function neigh(){
      try{
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(740, now + 0.10);
        osc.frequency.exponentialRampToValueAtTime(360, now + 0.30);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.15, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.35);
      } catch(e){}
    }

    // Rope attaches behind horse + to No
    function drawRope(){
      const h = getCenterPct(horse);
      const n = getCenterPct(noBtn);

      const vMag = Math.hypot(horseVX, horseVY) || 0.001;
      const dirX = horseVX / vMag;
      const dirY = horseVY / vMag;

      const rearOffset = 7.8;
      const hx = h.x - dirX * rearOffset;
      const hy = h.y - dirY * rearOffset;

      const midX = (hx + n.x) / 2;
      const midY = (hy + n.y) / 2 + 11;

      ropePath.setAttribute("d", `M ${hx} ${hy} Q ${midX} ${midY} ${n.x} ${n.y}`);
    }

    let speedBoost = 1;

    function updateSpeedBoostFromPointer(px, py){
      const r = areaRect();
      const inside = px >= r.left && px <= r.right && py >= r.top && py <= r.bottom;

      if (!inside) {
        speedBoost = lerp(speedBoost, 1, 0.08);
        return;
      }

      const hb = horse.getBoundingClientRect();
      const hx = hb.left + hb.width/2;
      const hy = hb.top  + hb.height/2;
      const dist = Math.hypot(px - hx, py - hy);

      const target = dist < 180 ? 2.6 : 1.0;
      speedBoost = lerp(speedBoost, target, 0.12);
    }

    let rafId = null;
    let dustTick = 0;

    function tick(){
      if (accepted) return;

      horseX += horseVX * speedBoost;
      horseY += horseVY * speedBoost;

      if (horseX < 0.08 || horseX > 0.92) horseVX *= -1;
      if (horseY < 0.20 || horseY > 0.88) horseVY *= -1;

      horseX = clamp(horseX, 0.08, 0.92);
      horseY = clamp(horseY, 0.20, 0.88);

      if (Math.random() < 0.03) horseVX += (Math.random() - 0.5) * 0.0013;
      if (Math.random() < 0.03) horseVY += (Math.random() - 0.5) * 0.0013;
      horseVX = clamp(horseVX, -0.0075, 0.0075);
      horseVY = clamp(horseVY, -0.0075, 0.0075);

      const vMag = Math.hypot(horseVX, horseVY) || 0.001;
      const facing = horseVX >= 0 ? 1 : -1;

      // lean forward a bit when fast
      const lean = (speedBoost > 1.6) ? (facing * 6) : 0;
      horse.style.transform = `translate(-50%, -50%) scaleX(${facing}) rotate(${lean}deg)`;

      setElNormPosition(horse, horseX, horseY);

      const dirX = horseVX / vMag;
      const dirY = horseVY / vMag;

      const ropeLen = 0.13 + 0.07 * speedBoost;
      const targetNoX = clamp(horseX - dirX * ropeLen, 0.08, 0.92);
      const targetNoY = clamp(horseY - dirY * ropeLen, 0.20, 0.88);

      const stiffness = 0.028;
      const damping = 0.86;

      const ax = (targetNoX - noX) * stiffness;
      const ay = (targetNoY - noY) * stiffness;

      noVX = (noVX + ax) * damping;
      noVY = (noVY + ay) * damping;

      noX += noVX;
      noY += noVY;

      noX = clamp(noX, 0.10, 0.90);
      noY = clamp(noY, 0.24, 0.86);

      setElNormPosition(noBtn, noX, noY);
      drawRope();

      dustTick++;
      if (speedBoost > 1.4 && dustTick % 10 === 0){
        spawnDust(speedBoost > 2 ? 2.4 : 1.3);
      }

      rafId = requestAnimationFrame(tick);
    }

    function start(){
      cancelAnimationFrame(rafId);

      horseX = 0.62; horseY = 0.52;
      noX = 0.56; noY = 0.62;
      noVX = 0; noVY = 0;

      horseVX = (Math.random() < 0.5 ? -1 : 1) * 0.0034;
      horseVY = (Math.random() < 0.5 ? -1 : 1) * 0.0028;

      speedBoost = 1;
      dustTick = 0;

      setElNormPosition(horse, horseX, horseY);
      setElNormPosition(noBtn, noX, noY);
      drawRope();

      rafId = requestAnimationFrame(tick);
    }

    function yankHorse(){
      horseVX += (Math.random() < 0.5 ? -1 : 1) * 0.0035;
      horseVY += (Math.random() < 0.5 ? -1 : 1) * 0.0035;
      horseVX = clamp(horseVX, -0.010, 0.010);
      horseVY = clamp(horseVY, -0.010, 0.010);

      speedBoost = 2.8;
      neigh();
      spawnDust(3);
    }

    document.addEventListener('mousemove', (e) => {
      if (accepted) return;
      updateSpeedBoostFromPointer(e.clientX, e.clientY);
    });

    document.addEventListener('touchmove', (e) => {
      if (accepted) return;
      if (!e.touches || !e.touches[0]) return;
      updateSpeedBoostFromPointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    noBtn.addEventListener('click', (e) => {
      if (accepted) return;
      yankHorse();
      e.preventDefault();
      e.stopPropagation();
    });

    noBtn.addEventListener('touchstart', (e) => {
      if (accepted) return;
      yankHorse();
      e.preventDefault();
    }, { passive: false });

    yesBtn.addEventListener('click', () => {
      if (accepted) return;
      accepted = true;

      result.textContent = "You said YES 😭💖";
      spawnHearts(30);

      cancelAnimationFrame(rafId);

      noBtn.style.opacity = 0.35;
      noBtn.style.pointerEvents = 'none';
      ropePath.setAttribute("stroke", "rgba(0,0,0,.10)");
      horse.style.opacity = 0.35;

      setTimeout(() => {
        finalScreen.classList.add('show');
        spawnHearts(34);
      }, 450);
    });

    moreHeartsBtn.addEventListener('click', () => spawnHearts(44));

    resetBtn.addEventListener('click', () => {
      accepted = false;
      finalScreen.classList.remove('show');
      result.textContent = "";
      noBtn.style.opacity = 1;
      noBtn.style.pointerEvents = 'auto';
      ropePath.setAttribute("stroke", "rgba(0,0,0,.20)");
      horse.style.opacity = 1;
      start();
    });

    window.addEventListener('resize', () => {
      if (accepted) return;
      start();
    });

    start();
  </script>
</body>
</html>
