<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Valentine for Dema</title>

<style>
  :root{
    --yes:#ff4d6d;
    --no:#6c757d;
    --shadow: 0 22px 70px rgba(0,0,0,.45);
    --cardText: #fff;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background:#0b0b0b;
    overflow:hidden;
  }

  .card{
    width:min(680px, 94vw);
    height: 600px; /* Increased height to fit the portrait photo better */
    border-radius:28px;
    overflow:hidden;
    position:relative;
    box-shadow: var(--shadow);
    color: var(--cardText);
  }

  .bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position: center 20%; /* Adjusted to focus on the face */
    filter: brightness(.65) contrast(1.1);
    z-index: 0;
  }

  .overlay{
    position:absolute;
    inset:0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.7));
    z-index: 1;
  }

  .content{
    position:relative;
    z-index: 2;
    padding:40px 26px;
    text-align:center;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end; /* Pushes text down so it doesn't cover your face */
    padding-bottom: 60px;
  }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(24px, 5vw, 38px);
    text-shadow: 2px 2px 15px rgba(0,0,0,0.9);
  }

  .playground{
    position:relative;
    height:150px;
    margin-top: 10px;
  }

  .btn{
    border:none;
    padding:14px 32px;
    border-radius:999px;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
    transition: transform .1s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }

  #yes{ background: var(--yes); color:white; }
  #no{ position:absolute; background: var(--no); color:white; left: 50%; transform: translateX(-50%); }

  .final{
    position:fixed;
    inset:0;
    display:none;
    place-items:center;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(6px);
    z-index: 100;
  }
  .final.show{ display:grid; }

  .finalCard{
    width:min(450px, 85vw);
    background: rgba(255, 255, 255, 0.98);
    color:#111;
    border-radius:24px;
    padding:35px;
    text-align:center;
    position: relative;
    z-index: 10001; 
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .heartsFull{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index: 10000;
  }

  .heart{
    position:absolute;
    top:-100px;
    will-change: transform;
    animation: smoothFall linear forwards;
  }

  @keyframes smoothFall {
    0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate3d(0, 110vh, 0) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="card">
  <img id="bgImg" class="bg" src="https://lh3.googleusercontent.com/d/1Xl2F9S7WzXl1l3x1x1x1x1x1x1x1x1x1" alt="Background">
  <div class="overlay"></div>

  <div class="content">
    <h1>Will you be my Valentine, Dema? 💘</h1>
    <div class="playground" id="playground">
      <button class="btn" id="yes">Yes 💞</button>
      <button class="btn" id="no">No 🙅‍♀️</button>
    </div>
  </div>
</div>

<div class="final" id="final">
  <div class="finalCard">
    <h2>YAYYY DEMAAAA 🥰💖</h2>
    <p>I love you, dummy. Of course I was gonna ask you! I knew you'd try to click "No" so I made it impossible. 😉</p>
    <button class="btn" id="again" style="background:#111; color:white; font-size: 14px; padding: 10px 20px;">🔁 Do it again</button>
  </div>
</div>

<div class="heartsFull" id="heartsFull"></div>

<script>
  // Note: To make this work instantly with YOUR photo, 
  // you'll need to upload that photo to a host or keep it in the folder.
  // For this demo, I've kept the logic ready for you.
  
  // TO USE YOUR EXACT PHOTO: 
  // 1. Save your photo as 'me.jpg' in the same folder as this HTML file.
  // 2. Change the src of 'bgImg' above to 'me.jpg'.

  const noBtn = document.getElementById("no");
  const playground = document.getElementById("playground");
  const yesBtn = document.getElementById("yes");
  const finalScreen = document.getElementById("final");
  const heartsFull = document.getElementById("heartsFull");
  const againBtn = document.getElementById("again");

  function moveNo() {
    const pRect = playground.getBoundingClientRect();
    const bRect = noBtn.getBoundingClientRect();
    const maxX = pRect.width - bRect.width;
    const maxY = pRect.height - bRect.height;
    
    const randomX = Math.max(10, Math.floor(Math.random() * maxX));
    const randomY = Math.max(10, Math.floor(Math.random() * maxY));
    
    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
  }

  noBtn.addEventListener("mouseenter", moveNo);
  noBtn.addEventListener("touchstart", (e) => { e.preventDefault(); moveNo(); });

  function spawnHearts() {
    const heartEmojis = ["💖", "💘", "💕", "❤️"];
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 20) + "px";
    heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
    
    heartsFull.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
  }

  let heartInterval;

  yesBtn.addEventListener("click", () => {
    finalScreen.classList.add("show");
    heartInterval = setInterval(spawnHearts, 250);
    for(let i=0; i<10; i++) spawnHearts();
  });

  againBtn.addEventListener("click", () => {
    finalScreen.classList.remove("show");
    clearInterval(heartInterval);
    heartsFull.innerHTML = "";
  });
</script>

</body>
</html>
