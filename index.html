<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Valentine for Dema</title>

<style>
  :root {
    --yes: #ff4d6d;
    --no: #6c757d;
    --rope: #8b4513;
    --pink-bg: #ffccd5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: var(--pink-bg);
    overflow: hidden;
    position: relative;
  }

  /* FLYING CUPIDS BACKGROUND */
  .background-cupids {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .floating-cupid {
    position: absolute;
    font-size: 40px;
    opacity: 0.6;
    animation: fly linear infinite;
  }

  @keyframes fly {
    from { transform: translate(-10vw, 0) rotate(0deg); }
    to { transform: translate(110vw, -20vh) rotate(20deg); }
  }

  /* MAIN CARD */
  .card {
    width: min(600px, 94vw);
    height: 550px;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(10px);
    border-radius: 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    border: 2px solid white;
  }

  h1 {
    color: #ff4d6d;
    font-size: clamp(24px, 5vw, 38px);
    margin-bottom: 20px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
  }

  .playground {
    width: 100%;
    height: 280px;
    position: relative;
    background: rgba(255, 255, 255, 0.4);
    border-radius: 20px;
    border: 1px dashed #ff4d6d;
  }

  /* TETHER MECHANICS */
  #horse {
    position: absolute;
    font-size: 45px;
    z-index: 15;
    pointer-events: none;
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  #rope {
    position: absolute;
    height: 3px;
    background: var(--rope);
    transform-origin: left center;
    z-index: 13;
    pointer-events: none;
    border-radius: 2px;
  }

  #no {
    position: absolute;
    background: var(--no);
    color: white;
    z-index: 14;
    font-size: 14px;
    padding: 8px 18px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
  }

  #yes {
    background: var(--yes);
    color: white;
    font-size: 24px;
    padding: 14px 40px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255,77,109,0.3);
    margin-bottom: 15px;
    z-index: 20;
  }

  /* FINAL SCREEN */
  .final {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    background: rgba(255, 77, 109, 0.4);
    backdrop-filter: blur(8px);
    z-index: 100000;
  }

  .final.show { display: grid; }

  .finalCard {
    background: white;
    padding: 40px;
    border-radius: 25px;
    text-align: center;
    max-width: 420px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.2);
    z-index: 100002;
  }

  /* SMOOTH HEARTS */
  .hearts-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100001; /* Between overlay and text card */
  }

  .heart {
    position: absolute;
    top: -50px;
    will-change: transform;
    animation: drift linear forwards;
  }

  @keyframes drift {
    to { transform: translateY(110vh) rotate(360deg); }
  }
</style>
</head>
<body>

  <div class="background-cupids" id="cupidBox"></div>

  <div class="card">
    <div style="font-size: 50px; margin-bottom: 10px;">👼</div>
    <h1>Will you be my Valentine, Dema?</h1>
    
    <button id="yes">Yes 💞</button>

    <div class="playground" id="playground">
      <div id="horse">🐎</div>
      <div id="rope"></div>
      <button id="no">No 🙅‍♀️</button>
    </div>
  </div>

  <div class="final" id="final">
    <div class="finalCard">
      <h2 style="color: #ff4d6d;">YAYYY DEMAAAA 🥰💖</h2>
      <p>I love you, dummy! I knew you'd try to click no, so I tied it to a horse!</p>
      <button onclick="location.reload()" style="background:#111; color:white; border:none; padding:10px 20px; border-radius:999px; cursor:pointer;">🔁 Try again</button>
    </div>
  </div>

  <div class="hearts-layer" id="heartsLayer"></div>

<script>
  const noBtn = document.getElementById("no");
  const horse = document.getElementById("horse");
  const rope = document.getElementById("rope");
  const playground = document.getElementById("playground");
  const yesBtn = document.getElementById("yes");
  const finalScreen = document.getElementById("final");
  const heartsLayer = document.getElementById("heartsLayer");
  const cupidBox = document.getElementById("cupidBox");

  // Generate Background Cupids
  for (let i = 0; i < 6; i++) {
    const c = document.createElement('div');
    c.className = 'floating-cupid';
    c.innerHTML = '👼';
    c.style.left = "-10vw";
    c.style.top = Math.random() * 80 + "vh";
    c.style.animationDuration = (Math.random() * 10 + 15) + "s";
    c.style.animationDelay = (Math.random() * 10) + "s";
    cupidBox.appendChild(c);
  }

  // Tether Logic
  let hX = 150, hY = 80;
  function update() {
    horse.style.left = hX + "px";
    horse.style.top = hY + "px";
    
    const nX = hX - 80;
    const nY = hY + 30;
    noBtn.style.left = nX + "px";
    noBtn.style.top = nY + "px";

    const x1 = hX + 20, y1 = hY + 30;
    const x2 = nX + 40, y2 = nY + 15;
    const len = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
    const ang = Math.atan2(y2-y1, x2-x1) * 180 / Math.PI;

    rope.style.width = len + "px";
    rope.style.left = x1 + "px";
    rope.style.top = y1 + "px";
    rope.style.transform = `rotate(${ang}deg)`;
  }

  playground.addEventListener("mousemove", (e) => {
    const rect = horse.getBoundingClientRect();
    const dist = Math.hypot(e.clientX - rect.left, e.clientY - rect.top);
    if (dist < 100) {
      hX = Math.random() * (playground.clientWidth - 150) + 70;
      hY = Math.random() * (playground.clientHeight - 80) + 20;
      update();
    }
  });

  window.onload = update;

  // Final Action
  yesBtn.addEventListener("click", () => {
    finalScreen.classList.add("show");
    setInterval(() => {
      const h = document.createElement("div");
      h.className = "heart";
      h.innerHTML = ["💖", "❤️", "💕"][Math.floor(Math.random()*3)];
      h.style.left = Math.random() * 100 + "vw";
      h.style.fontSize = (Math.random() * 20 + 20) + "px";
      h.style.animationDuration = (Math.random() * 3 + 6) + "s";
      heartsLayer.appendChild(h);
      setTimeout(() => h.remove(), 8000);
    }, 250);
  });
</script>

</body>
</html>
