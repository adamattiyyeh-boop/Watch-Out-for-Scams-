<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine for Dema</title>
  <style>
    :root{
      --bg1:#ffdee9;
      --bg2:#b5fffc;
      --card:#ffffffcc;
      --shadow: 0 20px 60px rgba(0,0,0,.15);
      --yes:#ff4d6d;
      --no:#6c757d;
      --ink:#151515;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, var(--bg1), var(--bg2));
      overflow:hidden;
      color:var(--ink);
    }
    .card{
      width:min(580px, 92vw);
      padding:28px 24px;
      border-radius:24px;
      background:var(--card);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    h1{
      margin:0 0 8px;
      font-size: clamp(24px, 4vw, 38px);
      letter-spacing:-.02em;
    }
    p{
      margin:0 0 18px;
      opacity:.85;
      font-size: 16px;
    }

    .playground{
      position:relative;
      height:260px;
      border-radius:18px;
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(0,0,0,.06);
      overflow:hidden;
      margin-top:14px;
    }

    .btn{
      border:none;
      padding:14px 18px;
      border-radius:999px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      transition: transform .08s ease, filter .15s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      letter-spacing:.2px;
    }
    .btn:active{ transform: scale(.98); }

    #yes{
      background: var(--yes);
      color:white;
      box-shadow: 0 12px 25px rgba(255, 77, 109, .35);
    }
    #yes:hover{ filter: brightness(1.03); }

    /* Horse + rope + No */
    #horse{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%, -50%);
      font-size: 34px;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.15));
      user-select:none;
      pointer-events:none;
      will-change: left, top, transform;
    }

    #rope{
      position:absolute;
      left:0;
      top:0;
      width:100%;
      height:100%;
      pointer-events:none;
    }

    #no{
      position:absolute;
      left: 65%;
      top: 55%;
      transform: translate(-50%, -50%);
      background: var(--no);
      color:white;
      box-shadow: 0 12px 25px rgba(108, 117, 125, .25);
      touch-action: manipulation;
      will-change: left, top;
      display:flex;
      align-items:center;
      gap:8px;
    }
    #no .tag{
      font-size:18px;
      line-height:1;
    }

    .row{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .result{
      margin-top:14px;
      font-weight:800;
      font-size:18px;
      min-height: 26px;
    }

    /* Hearts */
    .hearts{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      border-radius:24px;
    }
    .heart{
      position:absolute;
      bottom:-30px;
      font-size:18px;
      animation: floatUp linear forwards;
      opacity:.95;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.12));
    }
    @keyframes floatUp{
      to{
        transform: translateY(-440px) rotate(18deg);
        opacity:0;
      }
    }

    /* Final screen */
    .final{
      position:absolute;
      inset:0;
      display:none;
      place-items:center;
      padding:26px;
      background: radial-gradient(circle at top, rgba(255,255,255,.80), rgba(255,255,255,.58));
      backdrop-filter: blur(10px);
    }
    .final.show{ display:grid; }

    .finalCard{
      width:min(540px, 92vw);
      border-radius:22px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: var(--shadow);
      padding:22px 18px;
    }
    .finalTitle{
      font-size: clamp(22px, 4vw, 34px);
      margin:0 0 10px;
      letter-spacing:-.02em;
    }
    .finalMsg{
      margin:0 0 14px;
      opacity:.92;
      line-height:1.35;
      font-size:16px;
    }

    .catWrap{
      display:grid;
      place-items:center;
      margin: 12px 0 8px;
    }
    .catGif{
      width:min(320px, 85%);
      border-radius:18px;
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 14px 30px rgba(0,0,0,.12);
    }

    .pillRow{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:14px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 14px;
      border-radius:999px;
      font-weight:800;
      border: 1px solid rgba(0,0,0,.08);
      background: rgba(255,255,255,.75);
      cursor:pointer;
    }
    .pill:active{ transform: scale(.98); }
    .tiny{
      font-size:12px;
      opacity:.7;
      margin-top:10px;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="hearts" id="hearts"></div>

    <h1>Will you be my Valentine, Dema? 💘</h1>
    <p>Try clicking “No”… if the horse lets you 😭🐎</p>

    <div class="playground" id="playground" aria-label="button area">
      <svg id="rope" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path id="ropePath" d="" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="1.6" stroke-linecap="round" />
      </svg>

      <div class="row" style="position:absolute; inset:auto 0 18px 0;">
        <button class="btn" id="yes" type="button">Yes 💞</button>
      </div>

      <div id="horse" aria-hidden="true">🐎💨</div>

      <button class="btn" id="no" type="button">
        <span class="tag">🎀</span>
        No
      </button>
    </div>

    <div class="result" id="result"></div>

    <!-- Final overlay -->
    <div class="final" id="final">
      <div class="finalCard">
        <h2 class="finalTitle">YAYYY DEMAAAAA 🥰💖</h2>

        <p class="finalMsg">
          I love you, dummy. Of course, I was gonna ask you to be my Valentine.
          I predicted you would say something about me not asking thats why I added that part!
        </p>

        <div class="catWrap">
          <!-- You can swap this GIF link if you want a different dancing cat -->
          <img
            class="catGif"
            alt="Dancing cat gif"
            src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif"
          />
        </div>

        <div class="pillRow">
          <button class="pill" id="moreHearts" type="button">💘 More hearts</button>
          <button class="pill" id="reset" type="button">🔁 Do it again</button>
        </div>

        <div class="tiny">P.S. The horse said “nope” 🐎</div>
      </div>
    </div>
  </div>

  <script>
    const playground = document.getElementById('playground');
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const result = document.getElementById('result');
    const heartsLayer = document.getElementById('hearts');
    const finalScreen = document.getElementById('final');
    const moreHeartsBtn = document.getElementById('moreHearts');
    const resetBtn = document.getElementById('reset');

    const horse = document.getElementById('horse');
    const ropePath = document.getElementById('ropePath');

    let accepted = false;

    // Horse motion state
    let horseX = 0.5; // normalized 0..1 in playground
    let horseY = 0.5;
    let horseVX = (Math.random() < 0.5 ? -1 : 1) * 0.0024;
    let horseVY = (Math.random() < 0.5 ? -1 : 1) * 0.0020;

    // “Drag” physics for No button (trailing behind horse)
    let noX = 0.60; // normalized 0..1
    let noY = 0.55;
    let noVX = 0;
    let noVY = 0;

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }
    function lerp(a,b,t){ return a + (b-a)*t; }

    function areaRect(){
      return playground.getBoundingClientRect();
    }

    function pxToNorm(xPx, yPx){
      const r = areaRect();
      return {
        x: (xPx - r.left) / r.width,
        y: (yPx - r.top) / r.height
      };
    }

    function normToPx(xN, yN){
      const r = areaRect();
      return {
        x: r.left + xN * r.width,
        y: r.top  + yN * r.height
      };
    }

    function setElNormPosition(el, xN, yN){
      const r = areaRect();
      const box = el.getBoundingClientRect();
      const pad = 12;

      // convert desired normalized center to local pixels
      const cx = xN * r.width;
      const cy = yN * r.height;

      // clamp so element stays inside playground
      const minX = pad + box.width/2;
      const maxX = r.width - pad - box.width/2;
      const minY = pad + box.height/2;
      const maxY = r.height - pad - box.height/2;

      const clampedX = clamp(cx, minX, maxX);
      const clampedY = clamp(cy, minY, maxY);

      el.style.left = clampedX + "px";
      el.style.top  = clampedY + "px";
    }

    function getCenterNorm(el){
      const r = areaRect();
      const b = el.getBoundingClientRect();
      return {
        x: ((b.left + b.width/2) - r.left) / r.width,
        y: ((b.top + b.height/2) - r.top) / r.height
      };
    }

    function spawnHearts(count=18){
      const area = heartsLayer.getBoundingClientRect();
      for(let i=0;i<count;i++){
        const s = document.createElement('div');
        s.className = 'heart';
        s.textContent = Math.random() < .33 ? '💖' : (Math.random() < .5 ? '💘' : '💕');
        s.style.left = (Math.random() * area.width) + 'px';
        s.style.animationDuration = (1.6 + Math.random()*1.4) + 's';
        s.style.fontSize = (16 + Math.random()*22) + 'px';
        heartsLayer.appendChild(s);
        setTimeout(()=>s.remove(), 3200);
      }
    }

    // Rope drawing between horse and "No"
    function drawRope(){
      const r = areaRect();
      const horseC = horse.getBoundingClientRect();
      const noC = noBtn.getBoundingClientRect();

      const hx = ((horseC.left + horseC.width/2) - r.left) / r.width * 100;
      const hy = ((horseC.top  + horseC.height/2) - r.top)  / r.height * 100;

      const nx = ((noC.left + noC.width/2) - r.left) / r.width * 100;
      const ny = ((noC.top  + noC.height/2) - r.top)  / r.height * 100;

      // a little droop curve
      const midX = (hx + nx) / 2;
      const midY = (hy + ny) / 2 + 10; // droop down

      ropePath.setAttribute("d", `M ${hx} ${hy} Q ${midX} ${midY} ${nx} ${ny}`);
    }

    // Horse reacts to pointer proximity (runs faster)
    let speedBoost = 1;

    function updateSpeedBoostFromPointer(px, py){
      const r = areaRect();
      const inside =
        px >= r.left && px <= r.right &&
        py >= r.top  && py <= r.bottom;

      if (!inside) {
        speedBoost = lerp(speedBoost, 1, 0.08);
        return;
      }

      const horseBox = horse.getBoundingClientRect();
      const hx = horseBox.left + horseBox.width/2;
      const hy = horseBox.top  + horseBox.height/2;
      const dist = Math.hypot(px - hx, py - hy);

      // closer = faster
      const target = dist < 180 ? 2.4 : 1.0;
      speedBoost = lerp(speedBoost, target, 0.12);
    }

    // Animation loop: horse drags no button
    let rafId = null;
    function tick(){
      if (accepted) return;

      // move horse (chaotic but clamped)
      horseX += horseVX * speedBoost;
      horseY += horseVY * speedBoost;

      // bounce edges
      if (horseX < 0.08 || horseX > 0.92) horseVX *= -1;
      if (horseY < 0.18 || horseY > 0.88) horseVY *= -1;

      horseX = clamp(horseX, 0.08, 0.92);
      horseY = clamp(horseY, 0.18, 0.88);

      // random “swerve” so it feels dragged wild
      if (Math.random() < 0.03) horseVX += (Math.random() - 0.5) * 0.0012;
      if (Math.random() < 0.03) horseVY += (Math.random() - 0.5) * 0.0012;
      horseVX = clamp(horseVX, -0.006, 0.006);
      horseVY = clamp(horseVY, -0.006, 0.006);

      // place horse
      setElNormPosition(horse, horseX, horseY);

      // "No" trails behind the horse like a rope:
      // target behind horse based on horse velocity direction
      const vMag = Math.hypot(horseVX, horseVY) || 0.001;
      const dirX = horseVX / vMag;
      const dirY = horseVY / vMag;

      // behind horse (rope length)
      const ropeLen = 0.12 + 0.06 * speedBoost; // normalized
      const targetNoX = clamp(horseX - dirX * ropeLen, 0.08, 0.92);
      const targetNoY = clamp(horseY - dirY * ropeLen, 0.18, 0.88);

      // springy follow
      const stiffness = 0.025;
      const damping = 0.86;

      const ax = (targetNoX - noX) * stiffness;
      const ay = (targetNoY - noY) * stiffness;

      noVX = (noVX + ax) * damping;
      noVY = (noVY + ay) * damping;

      noX += noVX;
      noY += noVY;

      // keep no inside
      noX = clamp(noX, 0.10, 0.90);
      noY = clamp(noY, 0.22, 0.86);

      setElNormPosition(noBtn, noX, noY);
      drawRope();

      rafId = requestAnimationFrame(tick);
    }

    function start(){
      cancelAnimationFrame(rafId);
      // seed positions
      horseX = 0.62; horseY = 0.52;
      noX = 0.56; noY = 0.62;
      noVX = 0; noVY = 0;
      horseVX = (Math.random() < 0.5 ? -1 : 1) * 0.0032;
      horseVY = (Math.random() < 0.5 ? -1 : 1) * 0.0026;
      speedBoost = 1;

      setElNormPosition(horse, horseX, horseY);
      setElNormPosition(noBtn, noX, noY);
      drawRope();

      rafId = requestAnimationFrame(tick);
    }

    // Make No basically unclickable (it'll get dragged away)
    function yankHorse(){
      // quick burst
      horseVX += (Math.random() < 0.5 ? -1 : 1) * 0.003;
      horseVY += (Math.random() < 0.5 ? -1 : 1) * 0.003;
      horseVX = clamp(horseVX, -0.008, 0.008);
      horseVY = clamp(horseVY, -0.008, 0.008);
      speedBoost = 2.6;
    }

    // Events
    document.addEventListener('mousemove', (e) => {
      if (accepted) return;
      updateSpeedBoostFromPointer(e.clientX, e.clientY);
    });

    document.addEventListener('touchmove', (e) => {
      if (accepted) return;
      if (!e.touches || !e.touches[0]) return;
      updateSpeedBoostFromPointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    // If they try to click/tap No, the horse yanks it away
    noBtn.addEventListener('click', (e) => {
      if (accepted) return;
      yankHorse();
      e.preventDefault();
      e.stopPropagation();
    });

    noBtn.addEventListener('touchstart', (e) => {
      if (accepted) return;
      yankHorse();
      e.preventDefault();
    }, { passive: false });

    // YES behavior -> final screen
    yesBtn.addEventListener('click', () => {
      if (accepted) return;
      accepted = true;

      result.textContent = "You said YES 😭💖";
      spawnHearts(30);

      // freeze the chase
      cancelAnimationFrame(rafId);
      noBtn.style.opacity = 0.35;
      noBtn.style.pointerEvents = 'none';
      ropePath.setAttribute("stroke", "rgba(0,0,0,.10)");
      horse.style.opacity = 0.35;

      setTimeout(() => {
        finalScreen.classList.add('show');
        spawnHearts(34);
      }, 450);
    });

    moreHeartsBtn.addEventListener('click', () => spawnHearts(40));

    resetBtn.addEventListener('click', () => {
      accepted = false;
      finalScreen.classList.remove('show');
      result.textContent = "";
      noBtn.style.opacity = 1;
      noBtn.style.pointerEvents = 'auto';
      ropePath.setAttribute("stroke", "rgba(0,0,0,.18)");
      horse.style.opacity = 1;
      start();
    });

    // Keep inside on resize
    window.addEventListener('resize', () => {
      if (accepted) return;
      // just restart so measurements stay correct
      start();
    });

    // go
    start();
  </script>
</body>
</html>
